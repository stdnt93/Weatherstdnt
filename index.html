<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MGRS Вітер та Опади</title>

  <link rel="stylesheet" href="lib/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="search-panel">
    <input type="text" id="mgrs-input" placeholder="Введіть MGRS (напр. 36UUA12345678)"
           autocomplete="off" autocapitalize="characters" spellcheck="false" />
    <button id="search-btn">Перейти</button>
  </div>

  <div id="weather-card" class="hidden">
    <div class="weather-header">
      <span id="coords-display">--</span>
      <button id="close-card">✕</button>
    </div>

    <div class="precip-box">
      🌧 Опади: <strong id="precip">--</strong> мм/год
    </div>

    <div class="wind-table">
      <div class="wind-row header">
        <span>Висота</span>
        <span>Швидкість</span>
        <span>Напрямок</span>
