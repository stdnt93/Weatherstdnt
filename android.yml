name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6 leaflet@1.9.4
          mkdir -p www/lib
          cp index.html style.css app.js www/
          cp node_modules/leaflet/dist/leaflet.css node_modules/leaflet/dist/leaflet.js www/lib/
          cp -r node_modules/leaflet/dist/images www/lib/
          echo '{"appId":"app.mgrsweather","appName":"MGRS Wind","webDir":"www"}' > capacitor.config.json
      - name: Build Android project
        run: |
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mgrs-weather-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
